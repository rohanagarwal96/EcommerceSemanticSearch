# One-time setup on a fresh checkout, before the first `docker compose up`:
# `docker compose up -d qdrant`, then run `scripts/upload_index_to_qdrant.py`
# and `scripts/upload_multimodal_index_to_qdrant.py` against localhost:6333 to
# populate the two collections below from your local FAISS indexes -- a fresh
# qdrant container starts with no data. See README.md's "Running the App"
# section for the full walkthrough.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      # Only waits for the qdrant container process to start, not for its
      # collections to be populated (see the one-time setup note above) or
      # its HTTP API to be ready -- backend startup may need a retry if it
      # races qdrant's own boot.
      - qdrant
    environment:
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-ecommerce_products}
      QDRANT_IMAGE_COLLECTION_NAME: ${QDRANT_IMAGE_COLLECTION_NAME:-ecommerce_products_images}
    ports:
      - "8000:7860"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.ui
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:7860
    ports:
      - "8501:7860"

volumes:
  qdrant_storage:
